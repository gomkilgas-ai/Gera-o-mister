function advancePortugalPyramid(s,activeTable){
  if(!s.portugalPyramid)return null;
  const leagues=Object.fromEntries(PORTUGAL_DIVISION_ORDER.map(id=>[id,[...(s.portugalPyramid.leagues?.[id]||[])]]));
  const strengths={...(s.portugalPyramid.strengths||{})};
  for(const id of PORTUGAL_DIVISION_ORDER){
    if(!leagues[id].length)leagues[id]=LEAGUES.find(l=>l.id===id).teams.map(t=>t.id);
    for(const teamId of leagues[id]){
      const team=TEAMS.find(t=>t.id===teamId);
      if(team&&!Number.isFinite(strengths[teamId]))strengths[teamId]=team.str;
    }
  }
  const activeRanks=Object.fromEntries(activeTable.map((row,index)=>[row.id,index]));
  const hash=value=>[...value].reduce((result,char)=>(result*33+char.charCodeAt(0))>>>0,5381);
  const ordered=Object.fromEntries(PORTUGAL_DIVISION_ORDER.map(id=>{
    const ids=leagues[id];
    if(id===s.leagueId&&ids.every(teamId=>activeRanks[teamId]!=null)){
      return [id,[...ids].sort((a,b)=>activeRanks[a]-activeRanks[b])];
    }
    return [id,[...ids].sort((a,b)=>{
      const score=teamId=>(strengths[teamId]||50)+(((hash(`${teamId}-${s.year}`)%801)/100)-4);
      return score(b)-score(a)||a.localeCompare(b);
    })];
  }));
  const movedUp=[],movedDown=[];
  for(let i=0;i<PORTUGAL_DIVISION_ORDER.length-1;i++){
    const upper=PORTUGAL_DIVISION_ORDER[i],lower=PORTUGAL_DIVISION_ORDER[i+1];
    const relegated=ordered[upper].slice(-2),promoted=ordered[lower].slice(0,2);
    leagues[upper]=leagues[upper].filter(id=>!relegated.includes(id)).concat(promoted);
    leagues[lower]=leagues[lower].filter(id=>!promoted.includes(id)).concat(relegated);
    movedDown.push(...relegated);
    movedUp.push(...promoted);
  }
  for(const id of PORTUGAL_DIVISION_ORDER){
    ordered[id].forEach((teamId,index)=>{
      const current=strengths[teamId]||50;
      strengths[teamId]=Math.max(30,Math.min(95,current+(index<ordered[id].length*.25?1:index>=ordered[id].length*.75?-1:0)));
    });
  }
  const leagueId=PORTUGAL_DIVISION_ORDER.find(id=>leagues[id].includes(s.clubId))||s.leagueId;
  return {pyramid:{leagues,strengths},leagueId,movedUp,movedDown};
}

// Calendário: método do círculo; 2.ª volta espelha a 1.ª com mandos invertidos
function buildFixtures(ids){
  const n=ids.length,arr=[...ids],first=[];
  for(let r=0;r<n-1;r++){
    const rd=[];
    for(let i=0;i<n/2;i++){
      let h=arr[i],a=arr[n-1-i];
      if(i===0&&r%2===1)[h,a]=[a,h];
      rd.push({id:`R${r+1}-${h}-${a}`,h,a,hg:null,ag:null});
    }
    first.push(rd);
    arr.splice(1,0,arr.pop());
  }
  const second=first.map((rd,r)=>rd.map(m=>({id:`R${r+n}-${m.a}-${m.h}`,h:m.a,a:m.h,hg:null,ag:null})));
  return [...first,...second];
}
// Valida calendário: cada par joga 1x em casa e 1x fora, ninguém joga 2x na mesma jornada
function validateFixtures(fx,ids){
  const n=ids.length;if(!Array.isArray(fx)||fx.length!==2*(n-1))return 'Número de jornadas inválido';
  const seen=new Set();
  for(const rd of fx){
    if(!Array.isArray(rd)||rd.length!==n/2)return 'Jornada incompleta';
    const inRd=new Set();
    for(const m of rd){
      if(!ids.includes(m.h)||!ids.includes(m.a)||m.h===m.a)return 'Jogo inválido';
      if(inRd.has(m.h)||inRd.has(m.a))return 'Equipa repetida na jornada';
      inRd.add(m.h);inRd.add(m.a);
      const k=m.h+'>'+m.a;if(seen.has(k))return 'Jogo duplicado '+k;seen.add(k);
    }
  }
  return seen.size===n*(n-1)?null:'Faltam jogos';
}

function animateDayAdvance(fromDay,toDay,year){
  if(toDay<=fromDay||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches){render();return}
  DAY_TRANSITION={fromDay,toDay,year};
  render();
  const started=performance.now(),duration=Math.min(1400,Math.max(500,(toDay-fromDay)*85));
  const finish=()=>{if(!DAY_TRANSITION)return;clearTimeout(fallbackTimer);DAY_TRANSITION=null;render()};
  const fallbackTimer=setTimeout(finish,duration+150);
  const update=now=>{
    if(!DAY_TRANSITION)return;
    const progress=Math.min(1,(now-started)/duration),day=Math.round(fromDay+(toDay-fromDay)*progress);
    const date=document.getElementById('day-transition-date'),bar=document.getElementById('day-transition-progress'),count=document.getElementById('day-transition-count');
    if(date)date.textContent=dateOfDay(day,year);
    if(bar)bar.style.width=`${Math.round(progress*100)}%`;
    if(count)count.textContent=`Dia ${Math.max(1,day-fromDay)} de ${toDay-fromDay} · a preparar o próximo jogo`;
    if(progress<1)requestAnimationFrame(update);
    else finish();
  };
  requestAnimationFrame(update);
}

  if(a==='new-career'){MAIN_MENU=false;NEW_GAME_SETUP=true;NEWC=false;START_QUERY=''}
  if(a==='start'){S=newCareer(document.getElementById('mgr').value,START_CLUB);MK.chat=[CHAT_WELCOME];S={...S,transferChat:MK.chat,look:{...LOOK}};MAIN_MENU=false;NEW_GAME_SETUP=false;tab='cmd';save(S)}
  if(a==='day'){const previous=S,fromDay=S.day||0,year=S.year;S=advanceDay(S);if(S===previous)notice=S.live?'Termina o jogo ao vivo antes de avançar o dia.':S.round>=S.fixtures.length?'A época terminou.':'O próximo jogo já é hoje; escolhe jogar ou simular a jornada.';else{notice=save(S)?`Dia avançado: ${dateOfDay(S.day,S.year)}.`:'Dia avançado, mas não foi possível guardar a carreira neste navegador.';return animateDayAdvance(fromDay,S.day,year)}}
  if(a==='fast-forward'){const previous=S,fromDay=S.day||0,year=S.year;S=advanceToMatchDay(S);if(S===previous)notice='O próximo jogo já é hoje.';else{notice=save(S)?`Chegou o dia do jogo: ${dateOfDay(S.day,S.year)}.`:'Dia do jogo alcançado, mas não foi possível guardar a carreira neste navegador.';return animateDayAdvance(fromDay,S.day,year)}}
  if(a==='play'){if(S.day<S.round*7+6){const fromDay=S.day||0,year=S.year;S=advanceToMatchDay(S);notice=`Chegou o dia do jogo: ${dateOfDay(S.day,S.year)}.`;save(S);return animateDayAdvance(fromDay,S.day,year)}else{const q=lineupIssues(S);if(q.errors.length){notice='Não podes jogar: '+q.errors[0];tab='tac'}else{const round=S.round;S=playRound(S);const result=S.fixtures[round].find(m=>m.h===S.clubId||m.a===S.clubId);notice=`Resultado: ${name(result.h)} ${result.hg}–${result.ag} ${name(result.a)}.`;save(S)}}}
  if(a==='next-season'){const previous=S;S=startNextSeason(S);if(S===previous)notice='A próxima época só pode começar depois de terminarem todos os jogos.';else{tab='cmd';notice=`Época ${seasonLabel(S.year)} iniciada.`;save(S)}}
  if(a==='save')notice=save(S)?'Carreira guardada.':'Não foi possível guardar (armazenamento indisponível).';
  if(a==='load'){const r=load();if(r.state){S=r.state;MAIN_MENU=false;NEW_GAME_SETUP=false;notice='Gravação carregada.'}else notice=r.error||'Não existe gravação.'}
  if(a==='new'){if(NEWC||S.sacked){try{localStorage.removeItem(SAVE_KEY)}catch(e){}clearInterval(LT);S=null;LV=null;SEL=null;tab='cmd';NEWC=false;MAIN_MENU=false;NEW_GAME_SETUP=true;notice=null}else{NEWC=true;notice='Isto apaga a carreira atual. Clica em "Nova carreira" outra vez para confirmar.'}}
  render();
});
$.addEventListener('input',e=>{
  if(e.target.matches('[data-club-search]')){START_QUERY=e.target.value.toLocaleLowerCase();$.querySelectorAll('[data-club-option]').forEach(el=>{el.hidden=!el.dataset.clubName.includes(START_QUERY)});return}
  onLook(e,0);
});
$.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='market-chat-input'){e.preventDefault();sendMarketChat(e.target.value);render();document.getElementById('market-chat-input')?.focus()}});
$.addEventListener('change',e=>onLook(e,1));
tests=selfTest();
const r0=load();S=r0.state;notice=r0.error||null;if(S?.transferChat?.length)MK.chat=S.transferChat;render();
</script>
